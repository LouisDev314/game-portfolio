          - heading "Buying Time in Resident Evil 4 Remake" [level=1] [ref=e31]
          - paragraph [ref=e32]: How the 2023 remake turns positioning, crowd control, and resource spending into temporary breathing room—and keeps that room from becoming permanent safety.
          - paragraph [ref=e33]: By Louis Chan
