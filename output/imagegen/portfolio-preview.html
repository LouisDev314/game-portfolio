<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Louis Chan — Portfolio social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0a0a0a; color: #f5f5f5; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0a0a 0%, #0a0a0ae6 30%, #0a0a0a66 58%, transparent 78%); }
  .frame { position: absolute; inset: 28px; border: 1px solid #ffffff1a; border-radius: 28px; }
  main { position: absolute; left: 80px; top: 190px; }
  .accent { width: 44px; height: 4px; background: #fbbf24; border-radius: 999px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 94px; font-weight: 900; line-height: 1; letter-spacing: -0.07em; }
  .role { margin: 24px 0 0; color: #d4d4d4; font-size: 28px; font-weight: 600; line-height: 1.3; letter-spacing: 0.24em; text-transform: uppercase; }
  .support { margin: 36px 0 0; color: #a3a3a3; font-size: 22px; line-height: 1.5; }
</style>
<img class="art" src="portfolio-background.png" alt="Original illustrative environment; not a gameplay capture">
<div class="shade"></div>
<div class="frame"></div>
<main>
  <div class="accent"></div>
  <h1>Louis Chan</h1>
  <p class="role">Game Designer</p>
  <p class="support">Narrative · Gameplay · Level Design</p>
</main>
</html>
